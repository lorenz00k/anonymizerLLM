name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel outdated runs of the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: host/pyproject.toml
      - name: install dependencies
        run: pip install -e "host[dev]"

      - name: Ruff lint
        run: ruff check host

      - name: Ruff format check
        run: ruff format --check host

      - name: Tests
        run: pytest host
