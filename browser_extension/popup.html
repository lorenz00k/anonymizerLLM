<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      width: 260px;
      padding: 16px;
      margin: 0;
      color: #1f1f1f;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px 0;
      color: #444;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .toggle-row:last-of-type {
      border-bottom: none;
    }

    .toggle-row label {
      font-size: 13px;
      cursor: pointer;
    }

    /* einfacher iOS-artiger Switch statt der Standard-Checkbox */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      border-radius: 20px;
      transition: 0.15s;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      border-radius: 50%;
      transition: 0.15s;
    }

    input:checked + .slider {
      background-color: #4f46e5;
    }

    input:checked + .slider::before {
      transform: translateX(16px);
    }

    button {
      margin-top: 14px;
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f7f7f7;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #eee;
    }
  </style>
</head>
<body>
  <h1>PII Filter</h1>

  <div class="toggle-row">
    <label for="filterToggle">Filter aktiv</label>
    <span class="switch">
      <input type="checkbox" id="filterToggle">
      <span class="slider"></span>
    </span>
  </div>

  <div class="toggle-row">
    <label for="deanonymizeToggle">Rückübersetzen aktiv</label>
    <span class="switch">
      <input type="checkbox" id="deanonymizeToggle" checked>
      <span class="slider"></span>
    </span>
  </div>

  <button id="openRulesUi">Regeln verwalten</button>

  <script src="logger.js"></script>
  <script src="popup.js"></script>
</body>
</html>
