[project]
name = "piifilter"
version = "0.1.0"
description = "Lokaler Native-Messaging-Host fuer PII-Filterung"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
piifilter-host = "piifilter.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]