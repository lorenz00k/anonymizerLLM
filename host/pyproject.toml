[project]
name = "piifilter"
version = "0.1.0"
description = "Lokaler Native-Messaging-Host fuer PII-Filterung"
requires-python = ">=3.10"
dependencies = [
    "presidio-analyzer",
    "presidio-anonymizer",
    "spacy",
    "fastapi",
    "uvicorn",
    "requests"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
piifilter-host = "piifilter.__main__:main"
piifilter-rules-ui = "piifilter.rules_server:run"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
piifilter = ["static/*.html", "static/css/*.css", "static/js/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]