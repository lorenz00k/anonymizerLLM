<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>PII Filter – Eigene Regeln</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <h1>Eigene Regeln</h1>

  <div class="tabs">
    <button id="tabGlobalBtn" onclick="showTab('global')">Global</button>
    <button id="tabFoldersBtn" onclick="showTab('folders')">Ordner</button>
    <button id="tabChatBtn" onclick="showTab('chat')">Aktueller Chat</button>
  </div>

  <div id="tabGlobal" class="tab-content">
    <h2>Global (gilt immer)</h2>
    <table>
      <thead><tr><th>Original</th><th>Fake-Wert</th><th></th></tr></thead>
      <tbody id="globalBody"></tbody>
    </table>
    <input id="globalOriginal" placeholder="z.B. Projekt Phoenix">
    <input id="globalFake" placeholder="z.B. Projekt Falke">
    <button onclick="addGlobalRule()">Hinzufügen</button>
  </div>

  <div id="tabFolders" class="tab-content">
    <h2>Ordner (an/aus für alle Chats)</h2>
    <div id="foldersContainer"></div>
    <input id="newFolderName" placeholder="z.B. Projekt Phoenix">
    <button onclick="createFolder()">Neuer Ordner</button>
  </div>

  <div id="tabChat" class="tab-content">
    <h2 id="chatHeading">Aktueller Chat</h2>
    <p id="noChatHint" class="hint" style="display:none;">
      Kein Chat ausgewählt. Öffne diese Seite über den Button "Regeln verwalten"
      im Extension-Popup, während du in einem Chat bist.
    </p>
    <div id="chatSection" style="display:none;">
      <table>
        <thead><tr><th>Original</th><th>Fake-Wert</th><th></th></tr></thead>
        <tbody id="chatBody"></tbody>
      </table>
      <input id="chatOriginal" placeholder="z.B. Firma ABC">
      <input id="chatFake" placeholder="z.B. Firma Muster">
      <button onclick="addChatRule()">Hinzufügen</button>
    </div>
  </div>

  <script src="/static/js/shared.js"></script>
  <script src="/static/js/global.js"></script>
  <script src="/static/js/folders.js"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
